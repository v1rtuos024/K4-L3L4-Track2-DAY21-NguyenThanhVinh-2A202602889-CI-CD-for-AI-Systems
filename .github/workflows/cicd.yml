name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - '.dvc/config'
      - 'src/**'
      - 'tests/**'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: income-model-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Show OIDC trust claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(token);
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            for (const key of ['iss', 'aud', 'sub', 'repository', 'ref']) {
              core.info(`${key}: ${claims[key]}`);
            }
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 2
      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json
          import os
          with open('outputs/report.json') as report_file:
              report = json.load(report_file)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output_file:
              output_file.write(f"f1={report['f1_score']}\n")
          print(report)
          PY
      - name: Save model for release
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.joblib
          if-no-files-found: error
          retention-days: 7
      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check F1 threshold
        env:
          F1_SCORE: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import math
          import os
          f1 = float(os.environ['F1_SCORE'])
          if not math.isfinite(f1) or not 0.65 <= f1 <= 1.0:
              raise SystemExit(f'FAILED: f1_score={f1}; required 0.65 <= F1 <= 1.0')
          print(f'PASSED: f1_score={f1:.6f}')
          PY

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SECURITY_GROUP_ID: ${{ vars.SECURITY_GROUP_ID || secrets.SECURITY_GROUP_ID }}
      SERVER_SSH_FINGERPRINT: ${{ vars.SERVER_SSH_FINGERPRINT || secrets.SERVER_SSH_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models
      - name: Check deployment configuration
        run: |
          missing=0
          for name in SECURITY_GROUP_ID SERVER_SSH_FINGERPRINT SERVER_HOST SERVER_USER ARTIFACT_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. Configure it in repository Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 2
      - name: Get runner IP
        id: runner_ip
        run: |
          IP=$(curl -4 --fail --silent --show-error --max-time 15 https://checkip.amazonaws.com)
          echo "cidr=$IP/32" >> "$GITHUB_OUTPUT"
      - name: Allow runner SSH access
        id: open_ssh
        env:
          RUNNER_CIDR: ${{ steps.runner_ip.outputs.cidr }}
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR"
      - name: Configure SSH and verify server identity
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/income_deploy
          chmod 600 ~/.ssh/income_deploy
          for attempt in $(seq 1 10); do
            if ssh-keyscan -T 5 -t ed25519 "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            sleep 3
          done
          ACTUAL=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          test "$ACTUAL" = "$SERVER_SSH_FINGERPRINT"
      - name: Copy API code to EC2
        run: |
          scp -i ~/.ssh/income_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            src/serve.py "$SERVER_USER@$SERVER_HOST:src/serve.py"
      - name: Publish approved model
        run: |
          aws s3 cp models/model.joblib \
            "s3://$ARTIFACT_BUCKET/artifacts/current/model.joblib"
      - name: Restart API and check health
        run: |
          ssh -i ~/.ssh/income_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'BASH'
          sudo -n systemctl restart income-api
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 3 http://localhost:8080/healthz; then
              echo
              echo "Health check passed."
              exit 0
            fi
            sleep 3
          done
          sudo -n journalctl -u income-api -n 50 --no-pager
          exit 1
          BASH
      - name: Remove runner SSH access
        if: ${{ always() && steps.open_ssh.outcome == 'success' }}
        env:
          RUNNER_CIDR: ${{ steps.runner_ip.outputs.cidr }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR"
      - name: Remove local SSH key
        if: always()
        run: rm -f ~/.ssh/income_deploy
